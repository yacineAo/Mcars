; Mcars PHP overrides (development-leaning; tighten for production images).

memory_limit = 512M
max_execution_time = 120

; Contract scans, ID photos and damage photos come off phones — they are large.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 30

date.timezone = Africa/Algiers

; The ledger stores decimal(18,2). Never let PHP round money through floats.
serialize_precision = -1
precision = 17

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Surface everything during development. CI runs with the same settings.
error_reporting = E_ALL
display_errors = On
log_errors = On
