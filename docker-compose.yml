name: mcars

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: mcars/app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-mcars.ini:ro
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [mcars]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [mcars]

  pgsql:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mcars}
      POSTGRES_USER: ${DB_USERNAME:-mcars}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # Deterministic collation. Never rely on the host locale for ORDER BY.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mcars} -d ${DB_DATABASE:-mcars}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mcars]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [mcars]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks: [mcars]

  queue:
    image: mcars/app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=1
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-mcars.ini:ro
    depends_on:
      app:
        condition: service_started
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [mcars]

  scheduler:
    image: mcars/app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-mcars.ini:ro
    depends_on:
      app:
        condition: service_started
      pgsql:
        condition: service_healthy
    networks: [mcars]

volumes:
  postgres-data:
  redis-data:

networks:
  mcars:
    driver: bridge
